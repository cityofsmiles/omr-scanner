<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMR Scanner Prototype</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 16px;
    background: #0d1117;
    color: #e6edf3;
  }
  h2 { margin: 0 0 4px; font-size: 1.2rem; }
  p.sub { color: #8b949e; margin: 0 0 16px; font-size: 0.85rem; }
  #status {
    display: inline-block;
    margin-bottom: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    background: #21262d;
    font-size: 0.85rem;
    border: 1px solid #30363d;
  }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px;
  }
  .container { position: relative; width: 100%; max-width: 420px; }
  video { display: none; }
  canvas {
    width: 100%;
    border-radius: 8px;
    background: #222;
    display: block;
  }
  button {
    background: #238636;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    margin: 4px 4px 0 0;
  }
  button.secondary { background: #30363d; }
  button:disabled { background: #30363d; opacity: 0.5; cursor: not-allowed; }
  label { display: block; font-size: 0.75rem; color: #8b949e; margin-top: 8px; }
  input[type=number] {
    width: 70px; background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
    border-radius: 4px; padding: 4px 6px; font-size: 0.85rem;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 0.85rem; }
  th, td { border-bottom: 1px solid #30363d; padding: 4px 8px; text-align: left; }
  th { color: #8b949e; font-weight: 600; }
  .flag { color: #f0883e; }
  .ok { color: #3fb950; }
</style>
</head>
<body>

<h2>OMR Scanner Prototype</h2>
<p class="sub">Capture-on-demand · marker-based perspective correction · calibratable bubble grid</p>
<div id="status">Loading OpenCV.js...</div>

<div class="row">

  <div class="panel">
    <div class="container">
      <video id="webcam" playsinline></video>
      <canvas id="liveCanvas"></canvas>
    </div>
    <button id="captureBtn" disabled>Capture</button>
    <button id="retakeBtn" class="secondary" disabled>Retake</button>
  </div>

  <div class="panel">
    <div class="container">
      <canvas id="warpedCanvas"></canvas>
    </div>
    <button id="detectBtn" disabled>Detect Answers</button>
    <button id="csvBtn" class="secondary" disabled>Export CSV</button>
  </div>

  <div class="panel" style="min-width:260px;">
    <strong style="font-size:0.9rem;">Bubble grid calibration</strong>
    <div class="grid2">
      <div><label>Questions</label><input type="number" id="numQ" value="10" min="1"></div>
      <div><label>Choices (A,B,C...)</label><input type="number" id="numC" value="4" min="2" max="10"></div>
      <div><label>Start X (px)</label><input type="number" id="startX" value="80"></div>
      <div><label>Start Y (px)</label><input type="number" id="startY" value="120"></div>
      <div><label>Row spacing Y</label><input type="number" id="stepY" value="46"></div>
      <div><label>Choice spacing X</label><input type="number" id="stepX" value="48"></div>
      <div><label>Bubble radius</label><input type="number" id="radius" value="12"></div>
      <div><label>Fill threshold %</label><input type="number" id="thresh" value="40"></div>
    </div>
    <button id="overlayBtn" class="secondary">Redraw Grid Overlay</button>
    <p class="sub" style="margin-top:10px;">Adjust values until the overlay circles sit exactly over each bubble on the warped sheet, then hit Detect Answers.</p>
  </div>

</div>

<div class="panel" style="margin-top:16px; max-width:420px;" id="resultsPanel" hidden>
  <strong style="font-size:0.9rem;">Detected answers</strong>
  <table id="resultsTable"><thead><tr><th>Q</th><th>Answer</th><th>Fill %</th></tr></thead><tbody></tbody></table>
</div>

<!-- Pinned OpenCV.js version, not the floating docs/4.x URL -->
<script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-release.1/dist/opencv.js" onload="onOpenCvReady();"></script>

<script>
const video = document.getElementById('webcam');
const liveCanvas = document.getElementById('liveCanvas');
const warpedCanvas = document.getElementById('warpedCanvas');
const statusText = document.getElementById('status');
const captureBtn = document.getElementById('captureBtn');
const retakeBtn = document.getElementById('retakeBtn');
const detectBtn = document.getElementById('detectBtn');
const csvBtn = document.getElementById('csvBtn');
const overlayBtn = document.getElementById('overlayBtn');
const resultsPanel = document.getElementById('resultsPanel');
const resultsTable = document.getElementById('resultsTable').querySelector('tbody');

const TARGET_W = 850, TARGET_H = 1100; // canonical warped sheet size (px)

let stream = null;
let liveMat = null;       // reused each live frame
let warpedGray = null;    // persists after capture, deleted on retake
let rafId = null;
let cvReady = false;
let lastResults = [];

function onOpenCvReady() {
  cv['onRuntimeInitialized'] = () => {
    cvReady = true;
    statusText.innerText = 'OpenCV.js ready. Requesting camera...';
    startCamera();
  };
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: "environment" } },
      audio: false
    });
  } catch (err) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    } catch (err2) {
      statusText.innerText = 'Camera access denied or unavailable.';
      return;
    }
  }
  video.srcObject = stream;
  video.play();

  video.addEventListener('canplay', () => {
    video.width = video.videoWidth;
    video.height = video.videoHeight;
    liveCanvas.width = video.videoWidth;
    liveCanvas.height = video.videoHeight;

    if (liveMat) liveMat.delete();
    liveMat = new cv.Mat(video.height, video.width, cv.CV_8UC4);

    statusText.innerText = 'Live — align sheet, then Capture.';
    captureBtn.disabled = false;
    loopLive();
  }, { once: true });
}

function loopLive() {
  if (!stream) return;
  const cap = new cv.VideoCapture(video);
  function tick() {
    if (!stream) return;
    cap.read(liveMat);
    cv.imshow('liveCanvas', liveMat);
    rafId = requestAnimationFrame(tick);
  }
  tick();
}

function stopCamera() {
  if (rafId) cancelAnimationFrame(rafId);
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

window.addEventListener('beforeunload', stopCamera);

// ---- Capture + marker-based perspective correction ----

captureBtn.addEventListener('click', () => {
  if (!cvReady || !liveMat) return;

  const frame = liveMat.clone();
  const gray = new cv.Mat();
  cv.cvtColor(frame, gray, cv.COLOR_RGBA2GRAY);
  const blurred = new cv.Mat();
  cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
  const thresh = new cv.Mat();
  cv.threshold(blurred, thresh, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

  const contours = new cv.MatVector();
  const hierarchy = new cv.Mat();
  cv.findContours(thresh, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

  // Find small-ish, roughly square, solid contours = corner markers
  const frameArea = frame.rows * frame.cols;
  let candidates = [];
  for (let i = 0; i < contours.size(); i++) {
    const c = contours.get(i);
    const area = cv.contourArea(c);
    if (area > frameArea * 0.0005 && area < frameArea * 0.02) {
      const rect = cv.boundingRect(c);
      const aspect = rect.width / rect.height;
      if (aspect > 0.7 && aspect < 1.3) {
        candidates.push({ cx: rect.x + rect.width / 2, cy: rect.y + rect.height / 2, area });
      }
    }
    c.delete();
  }
  contours.delete(); hierarchy.delete(); thresh.delete(); blurred.delete(); gray.delete();

  if (candidates.length < 4) {
    statusText.innerText = `Only found ${candidates.length}/4 corner markers — retake with better lighting/alignment.`;
    frame.delete();
    return;
  }

  // Pick the 4 extreme corner candidates by x+y and x-y
  candidates.sort((a, b) => (a.cx + a.cy) - (b.cx + b.cy));
  const topLeft = candidates[0];
  const bottomRight = candidates[candidates.length - 1];
  candidates.sort((a, b) => (a.cx - a.cy) - (b.cx - b.cy));
  const bottomLeft = candidates[0];
  const topRight = candidates[candidates.length - 1];

  const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
    topLeft.cx, topLeft.cy,
    topRight.cx, topRight.cy,
    bottomRight.cx, bottomRight.cy,
    bottomLeft.cx, bottomLeft.cy
  ]);
  const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
    0, 0, TARGET_W, 0, TARGET_W, TARGET_H, 0, TARGET_H
  ]);

  const M = cv.getPerspectiveTransform(srcTri, dstTri);
  const warpedColor = new cv.Mat();
  cv.warpPerspective(frame, warpedColor, M, new cv.Size(TARGET_W, TARGET_H));

  if (warpedGray) warpedGray.delete();
  warpedGray = new cv.Mat();
  cv.cvtColor(warpedColor, warpedGray, cv.COLOR_RGBA2GRAY);

  warpedCanvas.width = TARGET_W;
  warpedCanvas.height = TARGET_H;
  cv.imshow('warpedCanvas', warpedColor);

  srcTri.delete(); dstTri.delete(); M.delete(); warpedColor.delete(); frame.delete();

  stopCamera();
  captureBtn.disabled = true;
  retakeBtn.disabled = false;
  detectBtn.disabled = false;
  statusText.innerText = 'Captured & corrected. Calibrate bubble grid, then Detect Answers.';
  drawOverlay();
});

retakeBtn.addEventListener('click', () => {
  if (warpedGray) { warpedGray.delete(); warpedGray = null; }
  resultsPanel.hidden = true;
  detectBtn.disabled = true;
  csvBtn.disabled = true;
  retakeBtn.disabled = true;
  captureBtn.disabled = false;
  startCamera();
});

// ---- Bubble grid overlay + detection ----

function getGridParams() {
  return {
    numQ: parseInt(document.getElementById('numQ').value, 10),
    numC: parseInt(document.getElementById('numC').value, 10),
    startX: parseFloat(document.getElementById('startX').value),
    startY: parseFloat(document.getElementById('startY').value),
    stepY: parseFloat(document.getElementById('stepY').value),
    stepX: parseFloat(document.getElementById('stepX').value),
    radius: parseFloat(document.getElementById('radius').value),
    thresh: parseFloat(document.getElementById('thresh').value)
  };
}

function drawOverlay() {
  if (!warpedGray) return;
  const p = getGridParams();
  const colorMat = new cv.Mat();
  cv.cvtColor(warpedGray, colorMat, cv.COLOR_GRAY2RGBA);
  for (let q = 0; q < p.numQ; q++) {
    const y = p.startY + q * p.stepY;
    for (let c = 0; c < p.numC; c++) {
      const x = p.startX + c * p.stepX;
      cv.circle(colorMat, new cv.Point(x, y), p.radius, [63, 185, 80, 255], 2);
    }
  }
  cv.imshow('warpedCanvas', colorMat);
  colorMat.delete();
}

overlayBtn.addEventListener('click', drawOverlay);

detectBtn.addEventListener('click', () => {
  if (!warpedGray) return;
  const p = getGridParams();
  lastResults = [];
  resultsTable.innerHTML = '';
  const letters = 'ABCDEFGHIJ';

  for (let q = 0; q < p.numQ; q++) {
    const y = p.startY + q * p.stepY;
    let fills = [];
    for (let c = 0; c < p.numC; c++) {
      const x = p.startX + c * p.stepX;
      fills.push(sampleFill(warpedGray, x, y, p.radius));
    }
    const maxFill = Math.max(...fills);
    const sorted = [...fills].sort((a, b) => b - a);
    const runnerUp = sorted[1] ?? 0;
    let answer, flagged = false;

    if (maxFill < p.thresh) {
      answer = 'BLANK'; flagged = true;
    } else if (maxFill - runnerUp < 10) {
      answer = letters[fills.indexOf(maxFill)] + '?'; flagged = true; // ambiguous, too close
    } else {
      answer = letters[fills.indexOf(maxFill)];
    }

    lastResults.push({ q: q + 1, answer, fill: maxFill.toFixed(1) });
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${q + 1}</td><td class="${flagged ? 'flag' : 'ok'}">${answer}</td><td>${maxFill.toFixed(1)}%</td>`;
    resultsTable.appendChild(tr);
  }
  resultsPanel.hidden = false;
  csvBtn.disabled = false;
});

// Fill % = darkness inside circular ROI, 0-100, using mean pixel intensity inverted
function sampleFill(grayMat, cx, cy, r) {
  const x0 = Math.max(0, Math.round(cx - r));
  const y0 = Math.max(0, Math.round(cy - r));
  const w = Math.min(grayMat.cols - x0, Math.round(r * 2));
  const h = Math.min(grayMat.rows - y0, Math.round(r * 2));
  if (w <= 0 || h <= 0) return 0;
  const roi = grayMat.roi(new cv.Rect(x0, y0, w, h));
  const mean = cv.mean(roi)[0]; // 0 (black) - 255 (white)
  roi.delete();
  return 100 - (mean / 255) * 100; // higher = darker = more filled
}

csvBtn.addEventListener('click', () => {
  const rows = ['question,answer,fill_percent', ...lastResults.map(r => `${r.q},${r.answer},${r.fill}`)];
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'omr_results.csv'; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
